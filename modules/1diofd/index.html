<section class="modulex-deger-katman-kesit{{fbsinif}}" {{fbetiket}}>

<style>
  /* deger-katman-kesit — deger-numara-serit ve deger-tablo eşit satırlardır, deger-yapiskan-yigin kartları üst üste bindirir; bu modülde satırlar tek bir kesitin bitişik katmanlarıdır — sıraya göre koyulaşan doku bandı ve kaydırma ilerlemesine bağlı derinlik cetveli iskeleti ailede tek. */
  .modulex-deger-katman-kesit { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-deger-katman-kesit *, .modulex-deger-katman-kesit *::before, .modulex-deger-katman-kesit *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-deger-katman-kesit :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-deger-katman-kesit :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-deger-katman-kesit :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-deger-katman-kesit :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-deger-katman-kesit img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-deger-katman-kesit) img { height: auto; }
  .modulex-deger-katman-kesit [hidden] { display: none !important; }
  .modulex-deger-katman-kesit :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-deger-katman-kesit :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-deger-katman-kesit-ic { max-width: --max--; margin-inline: auto; }
  .modulex-deger-katman-kesit-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-deger-katman-kesit--bassiz .modulex-deger-katman-kesit-bas { display: none; }
  .modulex-deger-katman-kesit-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-deger-katman-kesit-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-deger-katman-kesit-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-deger-katman-kesit-ic { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: clamp(32px, 5vw, 80px); align-items: start; }
  .modulex-deger-katman-kesit-bas { position: sticky; inset-block-start: 96px; margin: 0; }
  .modulex-deger-katman-kesit--bassiz .modulex-deger-katman-kesit-ic { grid-template-columns: minmax(0, 1fr); }
  .modulex-deger-katman-kesit-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-deger-katman-kesit-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-deger-katman-kesit-dugme:hover { transform: translateY(-2px); }
  .modulex-deger-katman-kesit-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-deger-katman-kesit-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-deger-katman-kesit-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-deger-katman-kesit-kesit { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; }
  .modulex-deger-katman-kesit-cetvel { position: relative; border-inline-end: 2px solid --text--; background: repeating-linear-gradient(180deg, --text-- 0 2px, transparent 2px 22px) 100% 0 / 12px 100% no-repeat; }
  [dir="rtl"] .modulex-deger-katman-kesit-cetvel { background-position: 0 0; }
  .modulex-deger-katman-kesit-imlec { position: absolute; inset-inline-end: -10px; inset-block-start: calc(var(--ilerleme, 1) * (100% - 18px)); width: 18px; height: 18px; border: 3px solid --bg--; border-radius: 50%; background: --accent--; box-shadow: 0 0 0 4px color-mix(in srgb, --accent-- 30%, transparent); transition: inset-block-start 0.25s linear; }
  .modulex-deger-katman-kesit-katmanlar { display: grid; overflow: hidden; border: 1px solid --cizgi--; border-radius: --yuvarlak--; }
  .modulex-deger-katman-kesit-katman { position: relative; display: grid; grid-template-columns: clamp(70px, 10vw, 128px) minmax(0, 1fr) auto; align-items: stretch; background: --kartBg--; transition: background-color 0.3s ease, box-shadow 0.3s ease; }
  .modulex-deger-katman-kesit-katman + .modulex-deger-katman-kesit-katman { border-block-start: 1px dashed --cizgi--; }
  .modulex-deger-katman-kesit-katman:hover { z-index: 1; background-color: color-mix(in srgb, --accent-- 6%, --kartBg--); box-shadow: 0 14px 30px -22px color-mix(in srgb, --text-- 70%, transparent); }
  .modulex-deger-katman-kesit-toprak { display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- calc(16% + var(--k) * 72%), --bg--); background-image: radial-gradient(circle at 30% 40%, color-mix(in srgb, --text-- 30%, transparent) 0 2px, transparent 2.5px), radial-gradient(circle at 70% 75%, color-mix(in srgb, --bg-- 55%, transparent) 0 1.5px, transparent 2px); background-size: 16px 16px, 23px 19px; transition: background-position 0.8s ease; }
  .modulex-deger-katman-kesit-katman:hover .modulex-deger-katman-kesit-toprak { background-position: 7px 5px, -6px 9px; }
  .modulex-deger-katman-kesit-derin { display: inline-grid; place-items: center; min-width: 44px; padding: 4px 8px; border-radius: 999px; background: --bg--; color: --text--; font-family: var(--mx-font-mono, ui-monospace, monospace); font-size: 0.85rem; font-weight: 700; }
  .modulex-deger-katman-kesit-yazi { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 16px; padding: clamp(20px, 2.6vw, 30px); transition: transform 0.35s ease; }
  .modulex-deger-katman-kesit-katman:hover .modulex-deger-katman-kesit-yazi { transform: translateX(6px); }
  [dir="rtl"] .modulex-deger-katman-kesit-katman:hover .modulex-deger-katman-kesit-yazi { transform: translateX(-6px); }
  .modulex-deger-katman-kesit-ic2 { display: grid; gap: 4px; }
  .modulex-deger-katman-kesit-ikon { justify-self: start; color: --accentInk--; font-size: 30px; }
  .modulex-deger-katman-kesit-kbaslik { font-size: 1.2rem; font-weight: 800; line-height: 1.25; }
  .modulex-deger-katman-kesit-kmetin { color: --muted--; font-size: 0.96rem; }
  .modulex-deger-katman-kesit-ad { align-self: center; margin-inline-end: 22px; padding: 5px 12px; border: 1px solid --cizgi--; border-radius: 6px; color: --accentInk--; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  @media (max-width: 768px) {
    .modulex-deger-katman-kesit-kesit { grid-template-columns: 22px minmax(0, 1fr); gap: 10px; }
    .modulex-deger-katman-kesit-katman { grid-template-columns: 58px minmax(0, 1fr); }
    .modulex-deger-katman-kesit-toprak { grid-row: span 2; }
    .modulex-deger-katman-kesit-yazi { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 16px; }
    .modulex-deger-katman-kesit-ad { grid-column: 2; justify-self: start; margin: 0 16px 16px; }
    .modulex-deger-katman-kesit-derin { min-width: 36px; font-size: 0.78rem; }
  }
  .modulex-deger-katman-kesit-bag { color: inherit; text-decoration: none; }
  .modulex-deger-katman-kesit-bag::after { content: ""; position: absolute; inset: 0; z-index: 3; }
  .modulex-deger-katman-kesit-bag:hover { text-decoration: underline; text-underline-offset: 4px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-katman-kesit :is(.modulex-deger-katman-kesit-baslik, .modulex-deger-katman-kesit-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-deger-katman-kesit-baslik { line-height: 1.35; }
  @media (max-width: 1024px) {
    .modulex-deger-katman-kesit-ic { grid-template-columns: minmax(0, 1fr); }
    .modulex-deger-katman-kesit-bas { position: static; margin-block-end: 32px; }
  }
  @media (max-width: 768px) {
    .modulex-deger-katman-kesit { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-deger-katman-kesit *, .modulex-deger-katman-kesit *::before, .modulex-deger-katman-kesit *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-deger-katman-kesit";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ilerleme = (s, P, az) => {
        if (az) { s.style.setProperty("--ilerleme", "1"); return; }
        let bekle = false;
        const hesap = () => {
          bekle = false;
          const r = s.getBoundingClientRect();
          const h = window.innerHeight || 1;
          const v = Math.min(1, Math.max(0, (h * 0.7 - r.top) / (r.height || 1)));
          s.style.setProperty("--ilerleme", v.toFixed(3));
        };
        window.addEventListener("scroll", () => { if (!bekle) { bekle = true; requestAnimationFrame(hesap); } }, { passive: true });
        hesap();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ilerleme(s, P, az);
    });
  })();
</script>
