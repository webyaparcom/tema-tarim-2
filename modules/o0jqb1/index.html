<header class="modulex-ust-ilerleme{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ust-ilerleme-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</header>

<style>
  /* ust-ilerleme — Menü aynı zamanda okuma göstergesi: uzun rehber/makale sayfalarında konum ve başa dönüş başlıkta; diğer menülerde kaydırma yalnız görünüşü değiştirir. */
  .modulex-ust-ilerleme { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-ilerleme *, .modulex-ust-ilerleme *::before, .modulex-ust-ilerleme *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-ilerleme :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-ilerleme :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-ilerleme :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-ilerleme :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-ilerleme img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-ilerleme) img { height: auto; }
  .modulex-ust-ilerleme [hidden] { display: none !important; }
  .modulex-ust-ilerleme :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-ilerleme :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-ilerleme-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-ilerleme-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-ilerleme--bassiz .modulex-ust-ilerleme-bas { display: none; }
  .modulex-ust-ilerleme-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ust-ilerleme-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ust-ilerleme-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-ilerleme-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-ilerleme-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-ilerleme-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-ilerleme-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-ilerleme-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ust-ilerleme-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ust-ilerleme { position: relative; z-index: 900; }
  .modulex-ust-ilerleme-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-ilerleme-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-ilerleme-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-ilerleme-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-ilerleme-oge:hover, .modulex-ust-ilerleme-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-ilerleme-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-ilerleme-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-ilerleme-cta .material-symbols-outlined, .modulex-ust-ilerleme-tel .material-symbols-outlined, .modulex-ust-ilerleme-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-ilerleme-tel, .modulex-ust-ilerleme-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-ilerleme-tel:hover, .modulex-ust-ilerleme-posta:hover { color: --accentInk--; }
  .modulex-ust-ilerleme-dil:empty { display: none; }
  .modulex-ust-ilerleme-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-ilerleme-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-ilerleme-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-ilerleme--acik .modulex-ust-ilerleme-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-ilerleme--acik .modulex-ust-ilerleme-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-ilerleme--acik .modulex-ust-ilerleme-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-ilerleme-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-ilerleme-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-ilerleme-sol 0.3s ease both; }
  @keyframes modulex-ust-ilerleme-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-ilerleme-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-ilerleme--js .modulex-ust-ilerleme-nav, .modulex-ust-ilerleme--js .modulex-ust-ilerleme-genis { display: none; }
    .modulex-ust-ilerleme--js .modulex-ust-ilerleme-ac { display: inline-flex; }
    .modulex-ust-ilerleme-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-ilerleme-in 0.3s ease both; }
    .modulex-ust-ilerleme-pliste { display: grid; }
    .modulex-ust-ilerleme-pliste .modulex-ust-ilerleme-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-ilerleme-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-ilerleme-panel { display: none !important; }
  }
  @keyframes modulex-ust-ilerleme-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  /* site kabuğu header modüllerini <div id="header"> içine koyar → bu modülü taşıyan kabuk yapışır (modül kendi de sticky: yedek) */
  #header:has(> .modulex-ust-ilerleme) { position: sticky; inset-block-start: 0; z-index: 955; }
  .modulex-ust-ilerleme.modulex-ust-ilerleme { position: sticky; inset-block-start: 0; z-index: 955; background-color: color-mix(in srgb, --bg-- 93%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); }
  .modulex-ust-ilerleme-cubuk { display: flex; align-items: center; justify-content: space-between; gap: 14px 28px; padding-block: 14px 16px; }
  .modulex-ust-ilerleme-oliste { display: flex; flex-wrap: wrap; gap: 4px 24px; }
  .modulex-ust-ilerleme-oliste .modulex-ust-ilerleme-oge[aria-current="page"] { text-decoration: underline dotted 2px; text-underline-offset: 7px; }
  .modulex-ust-ilerleme-cubuk > .modulex-ust-ilerleme-son { display: flex; align-items: center; gap: 10px; }
  .modulex-ust-ilerleme-genis { display: flex; align-items: center; gap: 12px; }
  .modulex-ust-ilerleme-iz { position: absolute; inset-inline: 0; inset-block-end: 0; height: 4px; overflow: hidden; background-color: --cizgi--; }
  .modulex-ust-ilerleme-akis { display: block; width: calc(var(--oku, 0) * 100%); height: 100%; border-start-end-radius: 4px; border-end-end-radius: 4px; background-image: linear-gradient(90deg, --accent--, color-mix(in srgb, --accent-- 55%, --text--)); transition: width 0.12s linear; }
  [dir="rtl"] .modulex-ust-ilerleme-akis { background-image: linear-gradient(270deg, --accent--, color-mix(in srgb, --accent-- 55%, --text--)); }
  .modulex-ust-ilerleme-basa { position: relative; display: inline-grid; flex: none; place-items: center; width: 46px; height: 46px; padding: 0; border: 0; border-radius: 50%; background: conic-gradient(--accent-- calc(var(--oku, 0) * 360deg), --cizgi-- 0); color: inherit; animation: modulex-ust-ilerleme-dog 0.3s ease both; }
  .modulex-ust-ilerleme-basa::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background-color: --bg--; }
  .modulex-ust-ilerleme-basa .material-symbols-outlined { position: relative; font-size: 20px; transition: transform 0.2s ease; }
  .modulex-ust-ilerleme-basa:hover .material-symbols-outlined { transform: translateY(-3px); }
  @keyframes modulex-ust-ilerleme-dog { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
  @media (max-width: 1024px) {
    .modulex-ust-ilerleme:not(.modulex-ust-ilerleme--js) .modulex-ust-ilerleme-cubuk { flex-wrap: wrap; }
  }
  @media (max-width: 768px) {
    .modulex-ust-ilerleme-basa { width: 42px; height: 42px; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-ilerleme :is(.modulex-ust-ilerleme-baslik, .modulex-ust-ilerleme-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-ilerleme-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-ilerleme { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-ilerleme *, .modulex-ust-ilerleme *::before, .modulex-ust-ilerleme *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-ilerleme";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const okuma = (s, P, az) => {
        const basa = s.querySelector("." + P + "-basa");
        let b = false;
        const u = () => {
          b = false;
          const d = document.documentElement;
          const y = window.scrollY || 0;
          const max = Math.max(1, d.scrollHeight - window.innerHeight);
          s.style.setProperty("--oku", Math.min(1, Math.max(0, y / max)).toFixed(4));
          const indi = y > window.innerHeight * 0.5;
          s.classList.toggle(P + "--indi", indi);
          if (basa) basa.hidden = !indi;
        };
        const iste = () => { if (!b) { b = true; requestAnimationFrame(u); } };
        window.addEventListener("scroll", iste, { passive: true });
        window.addEventListener("resize", iste);
        if (basa) basa.addEventListener("click", () => {
          window.scrollTo({ top: 0, behavior: az ? "auto" : "smooth" });
          const l = s.querySelector("a[href]");
          if (l) l.focus({ preventScroll: true });
        });
        u();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      okuma(s, P, az);
    });
  })();
</script>
